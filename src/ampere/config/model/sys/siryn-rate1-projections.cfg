# Configuration to simulate rate-1 for single Furiosa on unloaded Siryn SoC

# The rate-1 SoC, which uses the maintained fixed generic memory model
:cfg siryn-rate1.cfg

# 32 MB SLC for Rate 1 projection simulations: 2 MB in each of the 16 home nodes
~sys.soc_0.homenode_[0-9]+.enable_slc true
~sys.soc_0.homenode_[0-9]+.slc.array.size 2097152
~sys.soc_0.homenode_[0-9]+.slc.array.line_size 64
~sys.soc_0.homenode_[0-9]+.slc.array.ways 16
